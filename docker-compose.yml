version: '3.8'

services:
  api:
    build: .
    container_name: dva_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: dva_postgres
    restart: always
    environment:
      POSTGRES_USER: dva_admin
      POSTGRES_PASSWORD: dva_secure_password
      POSTGRES_DB: dva_volleyball
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
